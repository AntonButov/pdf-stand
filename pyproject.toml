[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-stand"
version = "0.1.0"
description = "PDF → JSON table extraction stand (pdfplumber)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Anton Butov" }]
dependencies = [
  "pdfplumber>=0.11.0",
  "Pillow>=10.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "reportlab>=4.2.0",
]

[project.scripts]
pdf-stand = "pdf_stand.cli:main"

[tool.setuptools.packages.find]
include = ["pdf_stand*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
